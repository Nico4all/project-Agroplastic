services:
  caudalia:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: caudalia-app:prod
    container_name: caudalia-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-mysql://root:docker@database:3306/financial_project}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    ports:
      - "${HOST_APP_PORT:-3001}:${APP_PORT:-3001}"
    networks:
      - apps_mind_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const p=process.env.PORT||3001; fetch('http://127.0.0.1:'+p+'/api/auth/me').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  apps_mind_net:
    external: true
